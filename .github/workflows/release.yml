name: release

on:
  push:
    branches: [main]

# One release run at a time so tags are computed from a settled state.
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/release.sh --push
        env:
          GH_TOKEN: ${{ github.token }}
