name: diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Render sample environments at base and head
        run: |
          git fetch origin "${{ github.base_ref }}"
          RTK="$(mise which rustanka)" scripts/diff.sh "origin/${{ github.base_ref }}" > diff.md
          # GitHub comments cap at 65536 characters.
          if [ "$(wc -c < diff.md)" -gt 60000 ]; then
            head -c 60000 diff.md > diff.trunc && printf '\n\n_Truncated; run `scripts/diff.sh` locally for the full diff._\n' >> diff.trunc && mv diff.trunc diff.md
          fi
      - name: Post sticky comment
        # Fork PRs get a read-only token; the job summary below still has the report.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file diff.md
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cat diff.md >> "$GITHUB_STEP_SUMMARY"
