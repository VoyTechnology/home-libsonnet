[tools]
go-jsonnet = "0.20.0"
jsonnet-bundler = "latest"

[tools."github:grafana/rustanka"]
version = "0.1.1"

[tools."github:grafana/rustanka".platforms]
macos-arm64 = { asset_pattern = "rustanka-darwin-arm64" }
macos-x64 = { asset_pattern = "rustanka-darwin-amd64" }
linux-arm64 = { asset_pattern = "rustanka-linux-arm64" }
linux-x64 = { asset_pattern = "rustanka-linux-amd64" }

[tasks.test]
description = "Render-test every library"
run = "make test"
